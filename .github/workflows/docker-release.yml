name: Publish Release Image to Docker Hub

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            target_cpu: generic
            tag_suffix: ""
          - platform: linux/arm64
            target_cpu: neoverse-v2
            tag_suffix: "-neoverse-v2"
          # amd64: x86-64-v2 (POPCNT, safe on any realistic CPU) and x86-64-v3
          # (+AVX2/BMI, Haswell+ / all EPYC). The bare x86-64 baseline is dropped —
          # it lacks POPCNT and no Vast.ai-era CPU needs it. Select per host with
          #   grep -q avx2 /proc/cpuinfo && tag=-amd64-v3 || tag=-amd64-v2
          - platform: linux/amd64
            target_cpu: x86-64-v2
            tag_suffix: "-amd64-v2"
          - platform: linux/amd64
            target_cpu: x86-64-v3
            tag_suffix: "-amd64-v3"

    steps:
      - uses: actions/checkout@v7

      - name: Rust Version Check
        run: rustc --version && cargo --version

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check and Test
        env:
          # .cargo/config.toml sets target-cpu=native, which is right for local perf builds and
          # wrong here: Swatinem/rust-cache keys on OS+arch+rustc+lockfile (v0-rust-build-Linux-x64-...)
          # with NO CPU model, and all four matrix jobs run on ubuntu-latest x86_64 sharing that one
          # key. So a proc-macro .so built with native on a wide-ISA runner gets restored onto a
          # narrower one, and rustc SIGILLs the moment it dlopens it -- which is exactly how run
          # 32201099089 died (crash inside libserde_derive 1.5s after "Restored from cache ... full
          # match: true"). RUSTFLAGS replaces build.rustflags outright, pinning a portable baseline.
          # Nothing is lost: this step is a correctness gate, and the shipped images set their own
          # RUSTFLAGS in the Dockerfile regardless.
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: |
          cargo check
          cargo test --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Release Tag
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        run: |
          docker buildx create --use
          docker buildx build --platform ${{ matrix.platform }} \
            --build-arg TARGET_CPU=${{ matrix.target_cpu }} \
            -t benferenchak/ramsey-worker-rust:${{ env.TAG_NAME }}${{ matrix.tag_suffix }} \
            -t benferenchak/ramsey-worker-rust:latest${{ matrix.tag_suffix }} \
            --push .
