name: Publish Release Image to Docker Hub

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_cpu: generic
            tag_suffix: ""
          - target_cpu: apple-m4
            tag_suffix: "-apple-m4"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Rust Version Check
        run: rustc --version && cargo --version

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check and Test
        run: |
          cargo check
          cargo test --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Release Tag
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg TARGET_CPU=${{ matrix.target_cpu }} \
            -t benferenchak/ramsey-worker-rust:${{ env.TAG_NAME }}${{ matrix.tag_suffix }} \
            -t benferenchak/ramsey-worker-rust:latest${{ matrix.tag_suffix }} \
            --push .
