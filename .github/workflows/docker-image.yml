name: Publish Container Image to Docker Hub

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            target_cpu: generic
            tag_suffix: ""
          - platform: linux/arm64
            target_cpu: neoverse-v2
            tag_suffix: "-neoverse-v2"
          - platform: linux/amd64
            target_cpu: x86-64
            tag_suffix: "-amd64"

    steps:
      - uses: actions/checkout@v6

      - name: Rust Version Check
        run: rustc --version && cargo --version

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check and Test
        run: |
          cargo check
          cargo test --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sanitize Git Branch Name
        id: sanitize_branch
        run: echo "BRANCH_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        run: |
          docker buildx create --use
          docker buildx build --platform ${{ matrix.platform }} \
            --build-arg TARGET_CPU=${{ matrix.target_cpu }} \
            -t benferenchak/ramsey-worker-rust:${{ env.BRANCH_NAME }}${{ matrix.tag_suffix }} \
            --push .
