[package]
name = "ramsey-worker-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
futures-util = "0.3"
rand = "0.10"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
tokio = { version = "1.52.3", features = ["full"] }

# GPU offload for the pair-move correction. macOS-only by construction: Metal is a macOS userspace
# framework and the Linux worker container has no GPU device nodes at all, so this must never enter
# the Docker build. Every use site is behind #[cfg(target_os = "macos")].
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[profile.release]
lto = "fat"          # Link-Time Optimization for better inlining across crates
codegen-units = 1    # Single codegen unit for best optimization (slower compile)
opt-level = 3        # Maximum optimization level
